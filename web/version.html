<!DOCTYPE html><html lang="en"><head><title>OGFStats – Version history</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon.svg">
<script>try{var t=localStorage.getItem("ogf-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/assets/style.css?v=__V__">
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="/assets/meta.js?v=__V__"></script>
<script src="/assets/app.js?v=__V__"></script></head>
<body data-page="version"><div class="wrap"><div class="page-head"><div><h1>Version history</h1></div></div>
<section class="card"><div class="tl" id="tl"></div></section></div>
<script>document.getElementById('tl').innerHTML=OGF.meta.history.map(function(v){return'<div><span class="tag">v'+OGF.esc(v.v)+'</span><strong>'+OGF.esc(v.date)+'</strong><p style="margin:6px 0 0;color:var(--muted)">'+OGF.esc(v.note)+'</p></div>'}).join('');</script></body></html>
